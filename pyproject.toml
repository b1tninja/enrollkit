[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback: with no
# build-system table pip injects an unpinned setuptools environment, so a build is
# neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enrollkit"
dynamic = ["version"]
# The description names the protocol and the documents, because that is the only text
# a person searching PyPI will read before deciding this is the library they need.
description = "Certificate enrollment: CMP to RFC 9810 with CRMF requests, EST to RFC 7030, PKCS#10 fallback, and the challenge and authentication mechanics around them"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["cmp", "est", "crmf", "enrollment", "pkcs10", "rfc9810", "rfc7030", "pki"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Empty unless a module cannot be honest without it. Every entry needs a sentence in
# README.md explaining why the zero-dependency rule was broken for it.
#
# asn1core is ours and carries every DER structure this project reads or writes: the CMP and
# CRMF message definitions are written here, on asn1core, and no third-party ASN.1 library is
# used. It is not on an index yet, so until it publishes it resolves from the sibling checkout
# (see pythonpath and mypy_path below), exactly as pkix resolves it; CI checks it out into .deps/.
#
# cryptography is admitted for cryptographic primitives only (signatures, MAC and key derivation
# building blocks, AES). Nothing that parses a wire format may import it.
dependencies = ["asn1core", "cryptography>50.0.2"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # tools/check_dist.py cannot assert a wheel contains what the docs promise without
  # first being able to build one, so the build dependency belongs in the dev group.
  "build",
]

[project.urls]
Homepage = "https://github.com/b1tninja/enrollkit"
Repository = "https://github.com/b1tninja/enrollkit"
Issues = "https://github.com/b1tninja/enrollkit/issues"
Changelog = "https://github.com/b1tninja/enrollkit/blob/main/CHANGELOG.md"

[project.scripts]
enrollkit = "enrollkit.cli:main"


[tool.hatch.version]
path = "enrollkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["enrollkit"]

[tool.hatch.build.targets.sdist]
include = ["/enrollkit/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../asn1core" resolves the codec from the sibling checkout in this workspace. It is not on an
# index yet, so a standalone clone cannot run the suite until asn1core publishes.
pythonpath = [".", "../asn1core"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["enrollkit"]

[tool.coverage.report]
# The shell floor, deliberately low and deliberately ratcheted: a stub only earns
# coverage for the line that raises. Raise this in the commit that implements a
# milestone, never in a commit that only adds tests, so the number keeps meaning
# "this behaviour is exercised" rather than "this file was imported".
fail_under = 45
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# CI checks asn1core out into .deps/ to satisfy an unpublished dependency; linting a borrowed
# checkout would make this project's gate depend on another project's style.
extend-exclude = [".deps"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501",  # line length is the formatter's job
]
# S101 is not ignored here: `python -O` strips an assert, so one in package code is a check that
# vanishes in exactly the build that ships without the test suite watching.

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a seeded generator rather than a token, and a
# test double has to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Checked against asn1core's own annotations when the sibling checkout is present.
mypy_path = "../asn1core"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
